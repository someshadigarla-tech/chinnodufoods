<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=../admin.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Admin Portal...</title>
  <script>
    window.location.replace("../admin.html" + window.location.hash + window.location.search);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #111827;
      color: #F9FAFB;
      text-align: center;
    }
    .card {
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(217, 119, 6, 0.2);
      border-top-color: #D97706;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #F59E0B;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin:0 0 10px; font-size:1.3rem;">Loading Chinnodu Foods Admin Portal...</h2>
    <p style="margin:0 0 16px; color:#9CA3AF; font-size:0.9rem;">Redirecting to secure admin panel...</p>
    <p style="font-size:0.8rem; color:#6B7280;">If not redirected automatically, <a href="../admin.html">click here</a>.</p>
  </div>
</body>
</html>
